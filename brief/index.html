<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>每日早報</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#2C74DB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="早報">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --paper: #F2F4F7;
  --sheet: #FFFFFF;
  --ink: #0E1A26;
  --muted: #566474;
  --line: #DCE1E7;
  --tint: rgba(14, 26, 38, .055);
  --accent: #2563D8;
  --coral: #D8452F;
  --coral-soft: rgba(216, 69, 47, .10);
  --amber: #B86E00;
  --ok: #26805F;
  --ok-soft: rgba(38, 128, 95, .12);
  --shadow: 0 1px 2px rgba(14, 26, 38, .05), 0 12px 28px -18px rgba(14, 26, 38, .35);
  --serif: ui-serif, "New York", "Songti TC", "Noto Serif TC", "Source Han Serif TC", "Noto Serif CJK TC", serif;
  --sans: -apple-system, "SF Pro Text", "PingFang TC", system-ui, "Noto Sans TC", "Noto Sans CJK TC", "Microsoft JhengHei", sans-serif;
  --sky-top: #2C74DB;
  --sky-bot: #1B4DA3;
  --glow: radial-gradient(120% 90% at 85% -10%, rgba(255, 226, 150, .38), transparent 62%);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #0A0F15;
    --sheet: #131B25;
    --ink: #E8EDF2;
    --muted: #98A6B5;
    --line: #232F3D;
    --tint: rgba(255, 255, 255, .06);
    --accent: #6FA3FF;
    --coral: #FF8468;
    --coral-soft: rgba(255, 132, 104, .14);
    --amber: #F2B24C;
    --ok: #4CC09A;
    --ok-soft: rgba(76, 192, 154, .16);
    --shadow: 0 0 0 1px rgba(255, 255, 255, .06);
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--paper); }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.5 var(--sans); font-variant-numeric: tabular-nums;
  -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none;
}
body.lock { overflow: hidden; }
a { color: inherit; }
button { font: inherit; color: inherit; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ——— 天空：整頁最飽和的東西，顏色跟著天氣與時間走 ——— */
.hero {
  position: relative; overflow: hidden; color: #fff;
  background: linear-gradient(180deg, var(--sky-top), var(--sky-bot));
  border-radius: 0 0 34px 34px;
}
.hero-bar { position: absolute; z-index: 3; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) max(20px, env(safe-area-inset-right)) 0 max(20px, env(safe-area-inset-left)); pointer-events: none; }
.hero-bar .btns { pointer-events: auto; }
/* 天氣：今天／明天左右滑動（兩頁各自帶著自己的天空顏色，滑動時一起移動） */
.pager { display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.pager::-webkit-scrollbar { display: none; }
.pager:focus-visible { outline: 2px solid #fff; outline-offset: -4px; border-radius: 0 0 34px 34px; }
.pg {
  position: relative; flex: 0 0 100%; min-width: 0; box-sizing: border-box; scroll-snap-align: start; scroll-snap-stop: always;
  background: linear-gradient(180deg, var(--pt, var(--sky-top)), var(--pb, var(--sky-bot)));
  padding: calc(env(safe-area-inset-top) + 54px) max(20px, env(safe-area-inset-right)) 22px max(20px, env(safe-area-inset-left));
}
.pg::before { content: ""; position: absolute; inset: 0; background: var(--pgl, var(--glow)); pointer-events: none; }
.hero.two .pg { padding-bottom: 40px; }
.dots { position: absolute; z-index: 3; left: 0; right: 0; bottom: 9px; display: flex; justify-content: center; }
.dot { width: 26px; height: 22px; padding: 0; border: 0; background: none; display: grid; place-items: center; cursor: pointer; }
.dot::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .45); transition: width .22s, background .22s; }
.dot[aria-current="true"]::before { width: 18px; background: #fff; }
.hero-in { position: relative; max-width: 520px; margin: 0 auto; }
.top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.top .d { font-size: 14.5px; font-weight: 600; letter-spacing: .01em; color: rgba(255, 255, 255, .94); }
.top .btns { display: flex; gap: 10px; }
.gbtn {
  width: 40px; height: 40px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  color: #fff; background: rgba(255, 255, 255, .17); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.gbtn:active { background: rgba(255, 255, 255, .3); }
.gbtn[disabled] .ico { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hi { margin: 14px 0 0; font: 400 30px/1.15 var(--serif); letter-spacing: .02em; }
.hnow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; }
.deg { font: 300 98px/.9 var(--serif); letter-spacing: -.045em; margin-left: -4px; }
.deg sup { font-size: .46em; vertical-align: top; position: relative; top: .08em; margin-left: 2px; letter-spacing: 0; }
.cond { display: grid; justify-items: end; gap: 2px; padding-bottom: 6px; text-align: right; }
.cond .ico { width: 44px; height: 44px; stroke-width: 1.5; }
.cond b { font-size: 18px; font-weight: 650; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 16px; margin-top: 10px; font-size: 14px; color: rgba(255, 255, 255, .92); }
.meta span { display: inline-flex; align-items: center; gap: 5px; }

.chart { position: relative; height: 128px; margin: 12px -4px 0; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart text { fill: rgba(255, 255, 255, .88); font: 600 10.5px var(--sans); }
.chart .tkx { fill: rgba(255, 255, 255, .78); font-weight: 500; }
.chart .ln { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.chart .ln.past { opacity: .5; }
.chart .guide { stroke: rgba(255, 255, 255, .4); stroke-width: 1; stroke-dasharray: 2 3; }
.chart .rb { fill: #A9D4FF; }
.draw .chart:not(.again) .ln { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.05s .12s cubic-bezier(.3, .7, .2, 1) forwards; }
.draw .chart:not(.again) .area { opacity: 0; animation: fade .7s .55s forwards; }
.draw .chart:not(.again) .orb { opacity: 0; transform-box: fill-box; transform-origin: center; animation: pop .5s 1s cubic-bezier(.2, 1.5, .4, 1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fade { to { opacity: 1; } }
@keyframes pop { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: scale(1); } }

.al { list-style: none; margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid rgba(255, 255, 255, .22); display: grid; gap: 9px; }
.al li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; font-size: 14.5px; line-height: 1.5; color: rgba(255, 255, 255, .97); }
.al .ico { width: 20px; height: 20px; margin-top: 1px; }
.al .txt { text-wrap: pretty; }

/* ——— 內容 ——— */
.main { max-width: 520px; margin: 0 auto; padding: 24px max(20px, env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
.sec { margin-top: 36px; }
.sec:first-child { margin-top: 0; }
.sh { display: flex; align-items: center; justify-content: space-between; min-height: 32px; margin: 0 0 12px; }
.sh h2 { margin: 0; font: 500 23px/1.2 var(--serif); letter-spacing: .01em; }
.sh small { margin-left: 8px; font: 500 13px var(--sans); color: var(--muted); }
.link { display: inline-flex; align-items: center; gap: 5px; padding: 10px 0 10px 10px; margin: -10px 0; font-size: 14px; font-weight: 600; color: var(--accent); text-decoration: none; background: none; border: 0; cursor: pointer; }
.link .ico { width: 17px; height: 17px; }
.link:active { opacity: .6; }
.note { margin: 0; color: var(--muted); font-size: 14.5px; }
.empty { display: grid; gap: 10px; justify-items: start; margin: 0; padding: 16px 18px; border-radius: 18px; background: var(--tint); color: var(--muted); font-size: 15px; }
.empty b { color: var(--ink); font-weight: 600; }
.pillbtn { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--ink); color: var(--sheet); font-size: 14px; font-weight: 650; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pillbtn .ico { width: 17px; height: 17px; }
.pillbtn:active { opacity: .75; }
.notice { display: grid; grid-template-columns: 20px 1fr; gap: 10px; margin: 0 0 22px; padding: 12px 14px; border-radius: 16px; background: var(--coral-soft); font-size: 14.5px; line-height: 1.5; }
.notice .ico { color: var(--coral); margin-top: 2px; }
.notice button { margin-top: 8px; }

/* 行程：時間 + 節點 + 內容；連線顏色代表交通是否緊湊 */
.allday { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
.pill { display: inline-flex; align-items: center; gap: 8px; max-width: 100%; padding: 6px 14px 6px 6px; border-radius: 999px; background: var(--tint); font-size: 14.5px; font-weight: 600; }
.pill i { padding: 2px 9px; border-radius: 999px; background: var(--ink); color: var(--sheet); font: 600 11.5px var(--sans); }
.route { display: block; }
.ev { position: relative; display: grid; grid-template-columns: 52px 14px minmax(0, 1fr); column-gap: 10px; padding: 0 0 20px; text-decoration: none; color: inherit; }
.ev:last-child { padding-bottom: 2px; }
.ev::before { content: ""; position: absolute; left: calc(52px + 10px + 6px); top: 0; bottom: 0; width: 2px; background: var(--line); }
.ev:first-child::before { top: 12px; }
.ev:last-child::before { bottom: auto; height: 12px; }
.ev:only-child::before { display: none; }
.ev.tight::before { background: linear-gradient(var(--coral), var(--coral)) 0 0 / 100% 12px no-repeat, var(--line); }
.ev.tn::before { background: linear-gradient(var(--coral), var(--coral)) 0 12px / 100% calc(100% - 12px) no-repeat, var(--line); }
.ev.tight.tn::before { background: var(--coral); }
.ev .t { font: 500 19px/1.2 var(--serif); }
.ev .t small { display: block; margin-top: 2px; font: 400 12px var(--sans); color: var(--muted); }
.ev .node { position: relative; z-index: 1; width: 14px; height: 14px; margin-top: 3px; border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 4px var(--paper); }
.ev.now .node { background: var(--accent); box-shadow: 0 0 0 4px var(--paper), 0 0 0 6px rgba(37, 99, 216, .32); }
.ev.tight .node { background: var(--coral); }
.ev .ttl { font-size: 17px; font-weight: 600; line-height: 1.35; text-wrap: pretty; }
.ev .loc { display: flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 13.5px; color: var(--muted); }
.ev .loc .ico { width: 14px; height: 14px; }
.ev.past { opacity: .5; }
.tag { margin-left: 6px; padding: 1px 8px; border-radius: 999px; font: 650 11.5px/1.5 var(--sans); vertical-align: 2px; white-space: nowrap; }
.tag.now { background: var(--accent); color: #fff; }
.tag.next { box-shadow: inset 0 0 0 1.5px var(--ink); }
.gaprow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 8px; }
.gapchip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px 3px 7px; border-radius: 999px; background: var(--coral-soft); color: var(--coral); font-size: 13px; font-weight: 650; }
.gapchip .ico { width: 15px; height: 15px; }
.gaptxt { color: var(--muted); font-size: 13px; }

/* 待辦 */
.todo { padding: 4px 16px; border-radius: 22px; background: var(--sheet); box-shadow: var(--shadow); }
.todo label { display: grid; grid-template-columns: 26px 1fr; gap: 14px; align-items: center; padding: 13px 0; border-top: 1px solid var(--line); font-size: 16.5px; line-height: 1.4; cursor: pointer; }
.todo label:first-child { border-top: 0; }
.todo input { -webkit-appearance: none; appearance: none; width: 26px; height: 26px; margin: 0; border: 2px solid var(--muted); border-radius: 50%; background: transparent center / 16px no-repeat; transition: background-color .18s, border-color .18s; }
.todo input:checked { background-color: var(--ok); border-color: var(--ok); background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='m5.5 12.5 4.2 4.2 8.8-9.4' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>"); }
.todo span { transition: color .18s; }
.todo label.done span { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(86, 100, 116, .6); }
.todo-note { margin: 10px 4px 0; color: var(--muted); font-size: 12.5px; }

/* 倒數日：票券；快到了的反白 */
.tickets { display: flex; gap: 12px; margin: 0 -20px -8px; padding: 4px 20px 22px; overflow-x: auto; scroll-snap-type: x proximity; scroll-padding: 0 20px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tickets::-webkit-scrollbar { display: none; }
.tk { --cut: 78px; position: relative; flex: none; width: 132px; height: 128px; padding: 0; border: 0; border-radius: 20px; background: var(--sheet); box-shadow: var(--shadow); color: var(--ink); text-align: left; cursor: pointer; scroll-snap-align: start; display: block; }
.tk::before, .tk::after { content: ""; position: absolute; top: var(--cut); width: 14px; height: 14px; border-radius: 50%; background: var(--paper); transform: translateY(-50%); }
.tk::before { left: -7px; }
.tk::after { right: -7px; }
.tk .top { position: absolute; inset: 0 0 auto 0; height: var(--cut); padding: 12px 16px 0; display: block; min-height: 0; }
.tk .num { font: 400 46px/1 var(--serif); letter-spacing: -.03em; }
.tk .num small { margin-left: 3px; font: 600 14px var(--sans); letter-spacing: 0; }
.tk .num.day0 { font-size: 26px; line-height: 46px; letter-spacing: 0; }
.tk .num.day0 small { font-size: 13px; }
.tk .bot { position: absolute; inset: var(--cut) 0 0 0; padding: 9px 16px 0; border-top: 1.5px dashed var(--line); }
.tk .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-size: 14.5px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
.tk .dt { margin-top: 2px; font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.tk .dt .ico { width: 12px; height: 12px; }
.tk.soon { background: var(--ink); color: var(--sheet); }
.tk.soon .bot { border-top-color: rgba(255, 255, 255, .28); }
.tk.soon .dt { color: inherit; opacity: .72; }
@media (prefers-color-scheme: dark) { .tk.soon { background: #E8EDF2; color: #0E1A26; } .tk.soon .bot { border-top-color: rgba(14, 26, 38, .25); } }
.tk.today { background: var(--coral); color: #fff; }
.tk.today .bot { border-top-color: rgba(255, 255, 255, .4); }
.tk.today .dt { color: inherit; opacity: .85; }
.tk.past { opacity: .55; }
.tk.add { background: none; box-shadow: inset 0 0 0 1.6px var(--line); display: grid; place-items: center; align-content: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 600; }
.tk.add::before, .tk.add::after { display: none; }
.tk.add .ico { width: 26px; height: 26px; }

/* 新聞：每類第一則放大成頭條 */
.ncat { margin-top: 28px; }
.ncat:first-of-type { margin-top: 4px; }
.ncat h3 { display: flex; align-items: baseline; gap: 10px; margin: 0 0 2px; font: 500 20px/1.3 var(--serif); }
.ncat h3 small { font: 500 12.5px var(--sans); color: var(--muted); }
.ncat ul { list-style: none; margin: 0; padding: 0; }
.ncat li + li a { border-top: 1px solid var(--line); }
.ncat a { display: block; padding: 13px 0; text-decoration: none; color: inherit; }
.ncat a:active { opacity: .6; }
.nt { font-size: 16px; line-height: 1.45; font-weight: 520; text-wrap: pretty; }
.ncat li:first-child .nt { font: 500 19px/1.42 var(--serif); }
.ns { display: flex; align-items: center; gap: 8px; margin-top: 5px; font-size: 12.5px; color: var(--muted); }
.ns i { width: 7px; height: 7px; border-radius: 50%; background: var(--c, #7B8794); flex: none; }
.ns .tr { padding: 0 5px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); font-size: 10.5px; line-height: 16px; }

.foot { margin-top: 38px; text-align: center; color: var(--muted); font-size: 12.5px; }

/* ——— 彈出面板 ——— */
#sheet-root .back { position: fixed; inset: 0; z-index: 50; background: rgba(6, 12, 20, .5); opacity: 0; transition: opacity .25s; }
#sheet-root.open .back { opacity: 1; }
#sheet-root .sheet {
  position: fixed; z-index: 51; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; max-height: 90vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--sheet); border-radius: 28px 28px 0 0; padding: 8px 20px calc(24px + env(safe-area-inset-bottom));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .85, .25, 1); box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, .5);
}
#sheet-root.open .sheet { transform: none; }
.grip { width: 38px; height: 5px; margin: 4px auto 6px; border-radius: 3px; background: var(--line); }
.sh-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 14px; }
.sh-head h2 { margin: 0; font: 500 24px/1.2 var(--serif); }
.x { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--tint); display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.fld { display: block; margin: 0 0 16px; font-size: 13.5px; font-weight: 650; color: var(--muted); }
.fld input[type=text], .fld input[type=url], .fld input[type=date], .fld input[type=search] {
  display: block; width: 100%; height: 50px; margin-top: 7px; padding: 0 14px; border: 0; border-radius: 14px; background: var(--tint); color: var(--ink);
  font: 400 17px var(--sans); -webkit-appearance: none; appearance: none; min-width: 0;
}
.fld input::placeholder { color: var(--muted); opacity: .7; }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 0 0 20px; padding: 12px 14px; border-radius: 14px; background: var(--tint); font-size: 16px; }
.sw small { display: block; color: var(--muted); font-size: 12.5px; }
.sw input { -webkit-appearance: none; appearance: none; flex: none; width: 52px; height: 32px; margin: 0; border-radius: 16px; background: var(--line); position: relative; transition: background .2s; cursor: pointer; }
.sw input::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s; }
.sw input:checked { background: var(--ok); }
.sw input:checked::after { transform: translateX(20px); }
.acts { display: grid; gap: 10px; }
.btn { min-height: 50px; padding: 0 20px; border: 0; border-radius: 15px; font-size: 16.5px; font-weight: 650; cursor: pointer; background: var(--tint); }
.btn.pri { background: var(--ink); color: var(--sheet); }
.btn.dng { background: var(--coral-soft); color: var(--coral); }
.btn:active { opacity: .7; }
.btn[disabled] { opacity: .5; }
.err { margin: -6px 0 14px; color: var(--coral); font-size: 14px; }
.okmsg { margin: 8px 0 0; color: var(--ok); font-size: 14px; font-weight: 600; }
.grp { margin: 0 0 26px; }
.grp h3 { margin: 0 0 6px; font: 500 19px/1.3 var(--serif); }
.grp > p { margin: 0 0 12px; color: var(--muted); font-size: 14.5px; }
.grp ol { margin: 8px 0 0; padding-left: 22px; color: var(--muted); font-size: 14.5px; }
.grp li { margin: 4px 0; }
.grp details { margin: 0 0 14px; padding: 12px 14px; border-radius: 14px; background: var(--tint); }
.grp summary { cursor: pointer; font-size: 14.5px; font-weight: 650; }
.lnk { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; margin: 0 0 8px; border-radius: 14px; background: var(--tint); font-size: 14.5px; }
.lnk span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lnk button { min-height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: var(--coral-soft); color: var(--coral); font-size: 13.5px; font-weight: 650; cursor: pointer; flex: none; }
.row2 { display: flex; gap: 10px; }
.row2 .fld { flex: 1; margin: 0; min-width: 0; }
.row2 .btn { align-self: flex-end; flex: none; }
.warnnote { margin: 10px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--coral-soft); font-size: 13.5px; line-height: 1.5; }

  // ---------- 時間（一律用台北時間，與後端一致）----------
  var fmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });

  function dateLabel(ymd) { var p = ymd.split("-"); return +p[1] + "月" + +p[2] + "日　週" + weekdayOf(ymd); }
  function toMin(hm) { var p = String(hm || "").split(":"); return p.length === 2 ? +p[0] * 60 + +p[1] : NaN; }

  function calshow(ymd, minutes) {

  }

  // ---------- 倒數日（與後端同一套算法，讓編輯後能立刻顯示）----------
  function isLeap(y) { return y % 4 === 0 && (y % 100 !== 0 || y % 400 === 0); }
  function nextYearly(ymd, today) {
    var p = ymd.split("-"), ty = +today.slice(0, 4), cand = ymd;
    for (var y = ty; y <= ty + 1; y++) {
      var m = +p[1], d = +p[2];
      if (m === 2 && d === 29 && !isLeap(y)) d = 28;

  }

  function wxGroup(code) {
    if (code == null) return "cloud";

    if (ph === "night") return { key: "night", phase: ph };

  // ---------- 設定（網址 #api=…&k=…，或存在 localStorage）----------

  function call(cfg, params, opts) {

           (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + "," + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + " " + p2[0].toFixed(1) + "," + p2[1].toFixed(1);

  function addDemoDays(ymd, n) { var d = new Date((dnum(ymd) + n) * 86400000); return d.getUTCFullYear() + "-" + pad2(d.getUTCMonth() + 1) + "-" + pad2(d.getUTCDate()); }

  // ---------- App 圖示（加到主畫面時 iOS 會讀取）----------
  function setIcon() {
    try {
      var c = document.createElement("canvas"); c.width = c.height = 180;
      var g = c.getContext("2d"), grd = g.createLinearGradient(0, 0, 0, 180);
      grd.addColorStop(0, "#2C74DB"); grd.addColorStop(1, "#1B4DA3");
      g.fillStyle = grd; g.fillRect(0, 0, 180, 180);
      g.fillStyle = "#FFD66B"; g.beginPath(); g.arc(90, 112, 40, Math.PI, 0); g.fill();            // 地平線上的太陽
      g.fillStyle = "rgba(255,255,255,.92)"; g.fillRect(30, 112, 120, 6);
      g.fillStyle = "rgba(255,255,255,.4)"; g.fillRect(52, 130, 76, 6);
      var l = document.createElement("link"); l.rel = "apple-touch-icon"; l.href = c.toDataURL("image/png"); document.head.appendChild(l);
    } catch (e) { /* 圖示只是加分項 */ }
  }

  // ---------- 啟動 ----------
  function boot() {
    state.view = "brief"; state.error = null; state.demo = "";
    try { localStorage.removeItem("brief.done"); } catch (e) { /* 舊版只記在手機上的打勾，已不再使用 */ }
    state.cfg = readConfig();
    if (state.demo) { state.data = demoData(state.demo); state.at = Date.now(); render(); return; }
    if (state.cfg) {
      pinHash(state.cfg);
      var c = jget("brief.cache", null);
      if (c && c.data && c.data.version === 2 && c.data.date === nowTP().date) { state.data = c.data; state.at = c.at; }   // 先秀今天的舊資料，同時在背景更新
      refresh();
    } else render();
  }
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible" || !state.cfg || state.busy || state.view !== "brief") return;
    var stale = !state.data || Date.now() - state.at > STALE_MS || state.data.date !== nowTP().date;
    if (stale) refresh(); else render();   // 沒過期也重畫一次，讓「現在」標記與已過行程跟上時間
  });
  window.addEventListener("hashchange", boot);

  setIcon();
  boot();
})();
